<!DOCTYPE html>
<html lang="tk">
<head>
    <meta charset="UTF-8">
    <title>Google</title>
    <!-- Socket.IO Kütüphanesi CDN güncellemesi -->
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }

        /* Fake Google Mask */
        #google-mask {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #ffffff; display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 9999;
        }
        .google-logo { font-size: 90px; font-weight: bold; font-family: 'Product Sans', sans-serif; letter-spacing: -3px; }
        .g-blue { color: #4285F4; }
        .g-red { color: #EA4335; }
        .g-yellow { color: #FBBC05; }
        .g-green { color: #34A853; }

        .search-box {
            margin-top: 30px; width: 580px; height: 46px; border: 1px solid #dfe1e5;
            border-radius: 24px; padding: 0 20px; display: flex; align-items: center;
            box-shadow: none; transition: box-shadow 0.2s;
        }
        .search-box:hover, .search-box:focus-within {
            box-shadow: 0 1px 6px rgba(32,33,36,0.28); border-color: rgba(223,225,229,0);
        }
        .search-box input {
            width: 100%; border: none; outline: none; font-size: 16px; color: #222;
        }
        .google-btns { margin-top: 30px; display: flex; gap: 12px; }
        .google-btns button {
            background: #f8f9fa; border: 1px solid #f8f9fa; border-radius: 4px;
            color: #3c4043; font-size: 14px; padding: 10px 16px; cursor: pointer;
        }
        .google-btns button:hover { border-color: #dadce0; color: #202124; }

        /* Modern Dark Chat UI */
        body {
            display: flex; height: 100vh;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #f8fafc; overflow: hidden;
        }

        #login-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px);
            display: flex; align-items: center; justify-content: center; z-index: 1000;
        }
        .login-card {
            background: rgba(30, 41, 59, 0.9); border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 35px; border-radius: 20px; width: 360px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); text-align: center;
        }
        .login-card h2 { color: #38bdf8; margin-bottom: 8px; font-size: 26px; }
        .login-card input[type="text"], .login-card input[type="password"] {
            width: 100%; padding: 12px; margin: 10px 0; background: rgba(15, 23, 42, 0.6);
            border: 1px solid #334155; border-radius: 10px; color: #fff; outline: none; font-size: 14px;
        }
        .color-picker-box {
            display: flex; align-items: center; justify-content: space-between;
            margin: 12px 0; padding: 8px 12px; background: rgba(15, 23, 42, 0.6);
            border: 1px solid #334155; border-radius: 10px;
        }
        .color-picker-box label { font-size: 13px; color: #94a3b8; }
        .color-picker-box input[type="color"] { border: none; width: 35px; height: 35px; cursor: pointer; background: transparent; }

        .login-card button {
            width: 100%; padding: 12px; background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            color: white; border: none; border-radius: 10px; cursor: pointer; font-weight: 600; font-size: 15px; margin-top: 10px;
        }

        .sidebar {
            width: 340px; background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px);
            border-right: 1px solid rgba(255, 255, 255, 0.05); display: flex; flex-direction: column;
        }
        .sidebar-header { height: 65px; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid rgba(255, 255, 255, 0.05); font-size: 22px; font-weight: 700; color: #38bdf8; }
        .profile-bar { padding: 12px 20px; background: rgba(15, 23, 42, 0.4); border-bottom: 1px solid rgba(255, 255, 255, 0.05); font-size: 13px; color: #94a3b8; display: flex; align-items: center; justify-content: space-between; }

        .chat-list { flex: 1; overflow-y: auto; padding: 10px; }
        .chat-item { display: flex; align-items: center; padding: 12px 14px; border-radius: 12px; cursor: pointer; margin-bottom: 4px; transition: background 0.2s; }
        .chat-item:hover, .chat-item.active { background: rgba(255, 255, 255, 0.08); }
        .avatar { width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; margin-right: 14px; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,0.5); box-shadow: 0 4px 10px rgba(0,0,0,0.3); }

        .main-chat { flex: 1; display: flex; flex-direction: column; background: linear-gradient(180deg, rgba(15,23,42,0.6) 0%, rgba(30,41,59,0.8) 100%); }
        .chat-header { height: 65px; background: rgba(30, 41, 59, 0.5); backdrop-filter: blur(10px); display: flex; align-items: center; padding: 0 25px; border-bottom: 1px solid rgba(255, 255, 255, 0.05); gap: 15px; }

        .messages-container { flex: 1; padding: 25px 40px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
        .msg-row { display: flex; flex-direction: column; max-width: 65%; }
        .msg-row.sent { align-self: flex-end; }
        .msg-row.received { align-self: flex-start; }

        .sender-name { font-size: 11px; margin-bottom: 3px; font-weight: 600; padding-left: 4px; }

        .msg-bubble {
            padding: 10px 16px; border-radius: 16px; font-size: 14px; line-height: 1.4; color: #f8fafc;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2); word-wrap: break-word; position: relative;
        }
        .sent .msg-bubble { background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%); border-bottom-right-radius: 4px; }
        .received .msg-bubble { background: rgba(51, 65, 85, 0.9); border: 1px solid rgba(255, 255, 255, 0.05); border-bottom-left-radius: 4px; }

        .chat-img { max-width: 100%; max-height: 300px; border-radius: 10px; margin-top: 5px; cursor: pointer; }
        .chat-video { max-width: 100%; max-height: 300px; border-radius: 10px; margin-top: 5px; }
        .chat-audio { width: 100%; margin-top: 5px; }
        .file-link { color: #38bdf8; text-decoration: underline; display: inline-block; margin-top: 5px; font-weight: bold; }

        .time { font-size: 10px; color: rgba(255,255,255,0.6); float: right; margin-left: 10px; margin-top: 4px; }

        .input-area {
            height: 70px; background: rgba(30, 41, 59, 0.8); backdrop-filter: blur(10px);
            display: flex; align-items: center; padding: 10px 20px; gap: 10px; border-top: 1px solid rgba(255, 255, 255, 0.05);
        }
        .input-area input[type="text"] {
            flex: 1; height: 46px; background: rgba(15, 23, 42, 0.6);
            border: 1px solid #334155; border-radius: 23px; padding: 0 20px; outline: none; font-size: 14px; color: #fff;
        }

        .file-btn {
            background: rgba(51, 65, 85, 0.8); border: 1px solid #334155; color: #fff;
            width: 46px; height: 46px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
            cursor: pointer; font-size: 20px; transition: background 0.2s;
        }
        .file-btn:hover { background: rgba(71, 85, 105, 1); }

        .send-btn {
            background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%);
            color: white; border: none; width: 46px; height: 46px; border-radius: 50%; cursor: pointer; font-size: 16px;
        }
        .logout-link { color: #ef4444; text-decoration: none; font-size: 12px; cursor: pointer; }
    </style>
</head>
<body>

    <!-- FAKE GOOGLE MASK -->
    <div id="google-mask">
        <div class="google-logo">
            <span class="g-blue">G</span><span class="g-red">o</span><span class="g-yellow">o</span><span class="g-blue">g</span><span class="g-green">l</span><span class="g-red">e</span>
        </div>
        <div class="search-box">
            <input type="text" id="google-input" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="" onkeypress="checkSecretKey(event)">
        </div>
        <div class="google-btns">
            <button onclick="handleGoogleSearch()">Google Search</button>
            <button onclick="handleGoogleSearch()">I'm Feeling Lucky</button>
        </div>
    </div>

    <!-- LOGIN PANEL -->
    <div id="login-overlay">
        <div class="login-card">
            <h2>imo Chat</h2>
            <p style="font-size: 12px; color: #94a3b8; margin-bottom: 15px;">Akkauntyňyza giriň ýa-da täzesini açyň</p>
            <input type="text" id="login-user" placeholder="Profil Adyňyz..." onkeypress="checkLoginEnter(event)">
            <input type="password" id="login-pass" placeholder="Parol..." onkeypress="checkLoginEnter(event)">
            <div class="color-picker-box">
                <label>Profil Reňkiňiz:</label>
                <input type="color" id="login-color" value="#38bdf8">
            </div>
            <button onclick="login()">Girmek / Registrasiýa</button>
        </div>
    </div>

    <!-- MAIN CHAT PANEL -->
    <div class="sidebar">
        <div class="sidebar-header"><span>imo</span></div>
        <div class="profile-bar">
            <div style="display:flex; align-items:center; gap:8px;">
                <div id="my-avatar-preview" class="avatar" style="width:24px; height:24px; font-size:11px;">?</div>
                <span id="my-profile-name">---</span>
            </div>
            <a class="logout-link" onclick="logout()">Çykmak</a>
        </div>
        <div class="chat-list" id="users-list"></div>
    </div>

    <div class="main-chat">
        <div class="chat-header">
            <div class="avatar" id="active-avatar" style="background: #0284c7;">G</div>
            <strong style="flex:1; font-size:18px;" id="active-chat-title">Gizlin Topar</strong>
        </div>

        <div class="messages-container" id="msg-box"></div>

        <div class="input-area">
            <label class="file-btn" title="Surat/Wideo/Faýl ýüklemek">
                📎
                <input type="file" id="file-input" style="display: none;" onchange="uploadFile(this)">
            </label>

            <input type="text" id="msg-input" placeholder="Hat ýazyň..." onkeypress="checkEnter(event)">
            <button class="send-btn" onclick="sendMsg()">➤</button>
        </div>
    </div>

    <script>
        // DÜZELTME: Render üzerindeki 400 Bad Request ve 502 hatalarını önlemek için doğrudan WebSocket kullanmaya zorlanıyor.
        const socket = io({
            transports: ['websocket'],
            upgrade: false
        });

        let myUsername = '';
        let myColor = '#38bdf8';
        let activeChat = 'Gizlin Topar';

        // GOOGLE MASKASYNÝŇ LOGIKASY
        function checkSecretKey(e) {
            if (e.key === 'Enter') {
                executeSearchLogic();
            }
        }

        function handleGoogleSearch() {
            executeSearchLogic();
        }

        function executeSearchLogic() {
            const val = document.getElementById('google-input').value.trim();
            if (val === '20.21') {
                document.getElementById('google-mask').style.display = 'none';
                document.getElementById('login-user').focus();
            } else if (val !== '') {
                window.location.replace("https://www.google.com/search?q=" + encodeURIComponent(val));
            }
        }

        // LOGIN LOGIKASY
        function login() {
            const user = document.getElementById('login-user').value.trim();
            const pass = document.getElementById('login-pass').value.trim();
            const color = document.getElementById('login-color').value;

            if (user && pass) {
                socket.emit('register_or_login', { username: user, password: pass, color: color });
            } else {
                alert('At we parol giriziň!');
            }
        }

        function checkLoginEnter(e) {
            if (e.key === 'Enter') {
                login();
            }
        }

        function logout() {
            location.reload();
        }

        socket.on('auth_result', function(res) {
            if (res.success) {
                myUsername = res.username;
                myColor = res.color || '#38bdf8';

                document.getElementById('my-profile-name').innerText = myUsername;
                const myPreview = document.getElementById('my-avatar-preview');
                myPreview.innerText = myUsername.charAt(0).toUpperCase();
                myPreview.style.background = myColor;

                document.getElementById('login-overlay').style.display = 'none';
                socket.emit('load_users');
                loadHistory();
            } else {
                alert(res.message);
            }
        });

        socket.on('update_users_list', function(users) {
            const list = document.getElementById('users-list');
            list.innerHTML = `
                <div class="chat-item ${activeChat === 'Gizlin Topar' ? 'active' : ''}" onclick="selectChat('Gizlin Topar', '#0284c7', this)">
                    <div class="avatar" style="background: #0284c7;">G</div>
                    <div><strong>Gizlin Topar</strong><br><small style="color:#94a3b8;">Umumy topar</small></div>
                </div>
            `;

            users.forEach(u => {
                if (u.username !== myUsername) {
                    const item = document.createElement('div');
                    const uColor = u.color || '#38bdf8';
                    item.className = `chat-item ${activeChat === u.username ? 'active' : ''}`;
                    item.onclick = function() { selectChat(u.username, uColor, this); };
                    item.innerHTML = `
                        <div class="avatar" style="background: ${uColor}">${u.username.charAt(0).toUpperCase()}</div>
                        <div>
                            <strong>${u.username}</strong><br>
                            <small style="color:#94a3b8;">Şahsy Chat</small>
                        </div>
                    `;
                    list.appendChild(item);
                }
            });
        });

        socket.on('chat_history', function(history) {
            const msgBox = document.getElementById('msg-box');
            msgBox.innerHTML = '';
            if (Array.isArray(history)) {
                history.forEach(data => appendMessage(data));
            }
            msgBox.scrollTop = msgBox.scrollHeight;
        });

        socket.on('receive_message', function(data) {
            const isGroup = activeChat === 'Gizlin Topar' && data.receiver === 'Gizlin Topar';
            const isDirectMsg = (data.sender === activeChat && data.receiver === myUsername) ||
                                (data.sender === myUsername && data.receiver === activeChat);

            if (isGroup || isDirectMsg) {
                appendMessage(data);
                const msgBox = document.getElementById('msg-box');
                msgBox.scrollTop = msgBox.scrollHeight;
            }
        });

        function selectChat(targetUser, color, el) {
            activeChat = targetUser;
            document.getElementById('active-chat-title').innerText = targetUser;
            const activeAvatar = document.getElementById('active-avatar');
            activeAvatar.innerText = targetUser.charAt(0).toUpperCase();
            activeAvatar.style.background = color;

            document.querySelectorAll('.chat-item').forEach(e => e.classList.remove('active'));
            el.classList.add('active');
            loadHistory();
        }

        function loadHistory() {
            if (myUsername) {
                socket.emit('load_history', { my_name: myUsername, active_chat: activeChat });
            }
        }

        function appendMessage(data) {
            const isMe = data.sender === myUsername;
            const msgBox = document.getElementById('msg-box');
            const row = document.createElement('div');
            row.className = `msg-row ${isMe ? 'sent' : 'received'}`;

            const userColor = data.sender_color || '#38bdf8';
            let contentHtml = '';

            if (data.msg_type === 'image') {
                contentHtml = `<img src="${data.message}" class="chat-img" onclick="window.open('${data.message}')">`;
            } else if (data.msg_type === 'video') {
                contentHtml = `<video src="${data.message}" controls class="chat-video"></video>`;
            } else if (data.msg_type === 'audio') {
                contentHtml = `<audio src="${data.message}" controls class="chat-audio"></audio>`;
            } else if (data.msg_type === 'file') {
                contentHtml = `📁 <a href="${data.message}" target="_blank" class="file-link">Faýly Ýükle</a>`;
            } else {
                contentHtml = data.message;
            }

            row.innerHTML = `
                ${!isMe ? `<div class="sender-name" style="color: ${userColor}">${data.sender}</div>` : ''}
                <div class="msg-bubble">
                    ${contentHtml}
                    <span class="time">${data.timestamp}</span>
                </div>
            `;
            msgBox.appendChild(row);
        }

        function sendMsg() {
            const input = document.getElementById('msg-input');
            if (input.value.trim() && myUsername) {
                socket.emit('send_message', {
                    sender: myUsername,
                    receiver: activeChat,
                    text: input.value.trim(),
                    msg_type: 'text',
                    color: myColor
                });
                input.value = '';
            }
        }

        function uploadFile(inputElement) {
            const file = inputElement.files[0];
            if (!file) return;

            const formData = new FormData();
            formData.append('file', file);

            fetch('/upload', {
                method: 'POST',
                body: formData
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    socket.emit('send_message', {
                        sender: myUsername,
                        receiver: activeChat,
                        text: data.url,
                        msg_type: data.file_type,
                        color: myColor
                    });
                } else {
                    alert('Faýl ýüklenmedi!');
                }
            })
            .catch(err => console.error(err));

            inputElement.value = '';
        }

        function checkEnter(e) { if (e.key === 'Enter') sendMsg(); }
    </script>
</body>
</html>
