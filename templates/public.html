<!DOCTYPE html>
<html lang="tk">
<head>
    <meta charset="UTF-8">
    <title>Google</title>
    <style>
        body { font-family: arial, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #fff; }
        .logo { font-size: 90px; font-weight: bold; font-family: 'Product Sans', sans-serif, arial; margin-bottom: 20px; letter-spacing: -2px; }
        .logo span:nth-child(1) { color: #4285F4; }
        .logo span:nth-child(2) { color: #EA4335; }
        .logo span:nth-child(3) { color: #FBBC05; }
        .logo span:nth-child(4) { color: #4285F4; }
        .logo span:nth-child(5) { color: #34A853; }
        .logo span:nth-child(6) { color: #EA4335; }

        .search-form { display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 584px; }
        .search-input-wrapper { width: 100%; position: relative; }
        .search-input { width: 100%; padding: 12px 20px; font-size: 16px; border: 1px solid #dfe1e5; border-radius: 24px; outline: none; box-sizing: border-box; }
        .search-input:hover, .search-input:focus { box-shadow: 0 1px 6px rgba(32,33,36,0.28); border-color: rgba(223,225,229,0); }

        .buttons { margin-top: 25px; }
        .btn { background-color: #f8f9fa; border: 1px solid #f8f9fa; border-radius: 4px; color: #3c4043; font-size: 14px; margin: 11px 4px; padding: 0 16px; height: 36px; cursor: pointer; }
        .btn:hover { border: 1px solid #dadce0; color: #202124; }
    </style>
</head>
<body>

    <!-- Google Logotipi -->
    <div class="logo">
        <span>G</span><span>o</span><span>o</span><span>g</span><span>l</span><span>e</span>
    </div>

    <!-- Gözleg Formasy -->
    <form class="search-form" action="/search" method="GET">
        <div class="search-input-wrapper">
            <input type="text" name="q" class="search-input" placeholder="" autofocus autocomplete="off">
        </div>
        <div class="buttons">
            <button type="submit" class="btn">Google Search</button>
            <button type="submit" class="btn">I'm Feeling Lucky</button>
        </div>
    </form>

</body>
</html>
